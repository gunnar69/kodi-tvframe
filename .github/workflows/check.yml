name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Design-Galerie (index.json)
        run: python3 tools/build_index.py --check
      - name: Kodi-Repository (repo/)
        run: python3 tools/build_repo.py --check
